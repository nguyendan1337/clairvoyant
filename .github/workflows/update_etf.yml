name: Run ETF Recommender

on:
  schedule:
    - cron: '17 23 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write

# Must match the stock workflow to serialize shared-cache and page updates.
concurrency:
  group: clairvoyant-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p caches

      # The path must match both recommender configs. The legacy filename is
      # not compatible with the stock recommender's entries-by-contract format.
      - name: Restore shared market-context cache
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: caches/gemini_shared_market_context_cache.json
          key: clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore ETF runtime cache
        id: etf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            caches/etf_yf_cache.json
            caches/top_qvm_etfs_cache.pkl
            caches/gemini_etf_research_cache.json
          key: clairvoyant-etf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clairvoyant-etf-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run ETF Recommender
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python etf_recommender.py

      - name: Save ETF runtime cache
        if: always() && steps.etf-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            caches/etf_yf_cache.json
            caches/top_qvm_etfs_cache.pkl
            caches/gemini_etf_research_cache.json
          key: ${{ steps.etf-cache.outputs.cache-primary-key }}

      # Missing or failed cache writes must not create an empty shared key.
      - name: Save shared market-context cache
        if: always() && hashFiles('caches/gemini_shared_market_context_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: caches/gemini_shared_market_context_cache.json
          key: clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('caches/gemini_shared_market_context_cache.json') }}

      # Retain diagnostics even when the recommender or git push fails.
      - name: Preserve ETF run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: run_reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push ETF page and run reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short

          if [ -f etf_index.html ]; then
            git add -f etf_index.html
          fi
          if [ -d run_reports ]; then
            git add run_reports/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update ETF recommendations and run reports"
            git pull --rebase origin main
            git push origin main
          else
            echo "No ETF page or run report changes to commit"
          fi
