name: Run ETF Recommender

on:
  schedule:
    - cron: '47 22 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write

# Use the same concurrency group as the stock workflow so the two recommenders
# never update main or the shared market-context cache at the same time.
concurrency:
  group: clairvoyant-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p caches

      # Shared by the stock and ETF workflows. A unique restore key avoids
      # trying to overwrite an immutable cache entry; restore-keys retrieves
      # the newest shared market cache saved by either workflow.
      - name: Restore shared market-context cache
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: caches/gemini_market_context_cache.json
          key: clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-restore-${{ github.run_id }}
          restore-keys: |
            clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore ETF runtime cache
        id: etf-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            caches/etf_yf_cache.json
            caches/top_qvm_etfs_cache.pkl
            caches/gemini_etf_research_cache.json
          key: clairvoyant-etf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            clairvoyant-etf-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run ETF Recommender
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python etf_recommender.py

      # Save validated runtime state even if a later step fails.
      - name: Save ETF runtime cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            caches/etf_yf_cache.json
            caches/top_qvm_etfs_cache.pkl
            caches/gemini_etf_research_cache.json
          key: ${{ steps.etf-cache.outputs.cache-primary-key }}

      # Save the shared cache by content hash. If the market context did not
      # change, GitHub can reuse the existing immutable cache instead of
      # creating another identical shared-market entry.
      - name: Save shared market-context cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: caches/gemini_market_context_cache.json
          key: clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('caches/gemini_market_context_cache.json') }}

      - name: Commit and push ETF page and run reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== ETF page ==="
          ls -lh etf_index.html || true

          echo "=== Run reports ==="
          ls -lh run_reports/ || true

          echo "=== Git status BEFORE staging ==="
          git status --short

          # etf_index.html is intentionally ignored for local development.
          if [ -f etf_index.html ]; then
            git add -f etf_index.html
          fi

          # Run reports are normal tracked diagnostic artifacts.
          if [ -d run_reports ]; then
            git add run_reports/
          fi

          echo "=== Git status AFTER staging ==="
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "Update ETF recommendations and run reports"
            git pull --rebase origin main
            git push origin main
          else
            echo "No ETF page or run report changes to commit"
          fi