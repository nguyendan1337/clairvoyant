name: Run recommenders and update page

# Trigger workflow on weekdays at 7 AM (local time) + manual trigger
on:
  schedule:
    - cron: '17 21 * * *' # 1 PM PST, 2 PM PDT Daily After Market Close, at 17 minutes to avoid automation congestion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      # This also restores the latest committed cache files.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run recommenders
      - name: Create cache directory
        run: mkdir -p caches

      - name: Run Stock Recommender
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python stock_recommender.py

      - name: Run ETF Recommender
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python etf_recommender.py

        # Step 5: Commit updated pages, caches, and generated data
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Files generated by Python ==="
          ls -lh \
            index.html \
            etf_index.html \
            top_qvm_stocks.md \
            top_qvm_etfs.md

          echo "=== Cache files ==="
          find caches -maxdepth 1 -type f -print -exec ls -lh {} \;

          echo "=== Git status BEFORE add ==="
          git status --short

          echo "=== Tracked cache files ==="
          git ls-files caches

          git add \
            index.html \
            etf_index.html \
            top_qvm_stocks.md \
            top_qvm_etfs.md \
            caches/

          # Remove obsolete root-level cache files from Git.
          # --ignore-unmatch makes this safe after they have already been removed.
          git rm --ignore-unmatch \
            yf_cache.json \
            etf_yf_cache.json \
            stock_pages_cache.json \
            etf_pages_cache.json \
            top_qvm_stocks_cache.pkl \
            top_qvm_etfs_cache.pkl \
            gemini_market_context_cache.json \
            gemini_stock_research_cache.json

          echo "=== Git status AFTER add ==="
          git status --short

          echo "=== Staged changes ==="
          git diff --cached --stat

          if ! git diff --cached --quiet; then
            git commit -m "Update stock and ETF data, pages, and caches"
            git push origin main
          else
            echo "No changes to commit"
          fi