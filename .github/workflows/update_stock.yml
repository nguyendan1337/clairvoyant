name: Run Stock Recommender

on:
  schedule:
    - cron: '7 19 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: write

# The ETF workflow must use this same group so it cannot restore or save the
# shared market cache while the stock workflow is updating it.
concurrency:
  group: clairvoyant-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p caches

      # This cache is deliberately independent of recommender/config hashes.
      # Compatibility is decided inside the JSON file by the stable market
      # contract. The ETF workflow must restore and save this exact path using
      # the same clairvoyant-market prefix.
      - name: Restore shared market-context cache
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: caches/gemini_shared_market_context_cache.json
          key: clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clairvoyant-market-${{ runner.os }}-${{ github.ref_name }}-
            clairvoyant-market-${{ runner.os }}-main-

      # Yahoo/QVM state is isolated from Gemini research so a future research
      # cache change cannot invalidate all of the market-data work with it.
      - name: Restore stock data cache
        id: stock-data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            caches/yf_cache.json
            caches/stock_pages_cache.json
            caches/top_qvm_stocks_cache.pkl
          key: clairvoyant-stock-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clairvoyant-stock-data-${{ runner.os }}-${{ github.ref_name }}-
            clairvoyant-stock-data-${{ runner.os }}-main-

      # Grounded Gemini research has its own content-addressed contract inside
      # the JSON file and therefore does not use source hashes in this key.
      - name: Restore stock research cache
        id: stock-research-cache
        uses: actions/cache/restore@v4
        with:
          path: caches/gemini_stock_research_cache_hardened.json
          key: clairvoyant-stock-research-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clairvoyant-stock-research-${{ runner.os }}-${{ github.ref_name }}-
            clairvoyant-stock-research-${{ runner.os }}-main-

      - name: Show restored cache state
        run: |
          echo "=== Restored cache files ==="
          find caches -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "Market matched key: ${{ steps.market-cache.outputs.cache-matched-key }}"
          echo "Stock data matched key: ${{ steps.stock-data-cache.outputs.cache-matched-key }}"
          echo "Stock research matched key: ${{ steps.stock-research-cache.outputs.cache-matched-key }}"

      - name: Run Stock Recommender
        id: stock-run
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python stock_recommender.py

      # Save partial but atomically validated state even if the recommender or a
      # later publishing step fails. cache-primary-key is the unique key passed
      # to the corresponding restore step above.
      - name: Save stock data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            caches/yf_cache.json
            caches/stock_pages_cache.json
            caches/top_qvm_stocks_cache.pkl
          key: ${{ steps.stock-data-cache.outputs.cache-primary-key }}

      - name: Save stock research cache
        if: ${{ always() && hashFiles('caches/gemini_stock_research_cache_hardened.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: caches/gemini_stock_research_cache_hardened.json
          key: ${{ steps.stock-research-cache.outputs.cache-primary-key }}

      - name: Save shared market-context cache
        if: ${{ always() && hashFiles('caches/gemini_shared_market_context_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: caches/gemini_shared_market_context_cache.json
          key: ${{ steps.market-cache.outputs.cache-primary-key }}

      - name: Show saved cache state
        if: always()
        run: |
          echo "=== Final cache files ==="
          find caches -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "Market save key: ${{ steps.market-cache.outputs.cache-primary-key }}"
          echo "Stock data save key: ${{ steps.stock-data-cache.outputs.cache-primary-key }}"
          echo "Stock research save key: ${{ steps.stock-research-cache.outputs.cache-primary-key }}"

      - name: Commit and push stock page and run reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Stock page ==="
          ls -lh index.html || true

          echo "=== Run reports ==="
          ls -lh run_reports/ || true

          echo "=== Git status BEFORE staging ==="
          git status --short

          # Preserve the prior published page and report if the recommender
          # failed, even if it had written a new index.html before failing.
          if [ "${{ steps.stock-run.outcome }}" = "success" ]; then
            if [ -f index.html ]; then
              git add -f index.html
            fi
            if [ -d run_reports ]; then
              git add run_reports/
            fi
          else
            echo "Stock run did not succeed; keeping the previous published page and report."
            if git ls-files --error-unmatch index.html >/dev/null 2>&1; then
              git restore --worktree -- index.html
            fi
            if [ -f run_reports/stock_run.log ]; then
              git add run_reports/stock_run.log
            fi
          fi

          echo "=== Git status AFTER staging ==="
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "Update stock recommendations and run reports"
            git pull --rebase origin main
            git push origin main
          else
            echo "No stock page or run report changes to commit"
          fi