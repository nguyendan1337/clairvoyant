---

url: "https://finance.yahoo.com/markets/stocks/52-week-gainers/"
min_52_week_change: 25
max_retries: 2
initial_delay: 10
model_primary: gemini-2.5-flash
# Research fails closed instead of silently publishing lower-quality Lite output.
model_fallback: gemini-2.5-flash-lite
gemini_batch_size: 15
max_candidates: 50
target_selected_stocks: 10
max_stocks_per_sector: 2
max_moderate_per_risk_event: 2
thinking_budget: 12288
require_google_search: true
max_gemini_calls_per_run: 8
market_context_cache_file: caches/gemini_market_context_cache.json
stock_research_cache_file: caches/gemini_stock_research_cache.json
gemini_research_cache_hours: 12
# Increment whenever research semantics change so stale classifications are not reused.
cache_version: 1
final_summary_enabled: true
summary_thinking_budget: 4096

prompt_market_context: |
  You are an expert U.S. stock-market analyst with real-time Google Search.

  PURPOSE
  Research the CURRENT U.S. market and world environment once so the resulting
  context can be reused when evaluating QVM-ranked stocks today.

  This task requires current web research. Use Google Search before answering.
  Prefer evidence from the past 5-10 days, extending to approximately 30 days
  only for continuing events that remain materially relevant.

  RESEARCH COVERAGE
  Use multiple targeted searches to assess:
    1. S&P 500 direction, recent performance, breadth, and market health
    2. Investor mood and the largest current market drivers
    3. Inflation, interest rates, Federal Reserve expectations, and major macro data
    4. U.S. earnings trends and material regulatory developments
    5. Wars, geopolitical disruptions, and major world developments
    6. Energy, commodity, freight, and supply-chain conditions
    7. Currently strong, mixed, and weak U.S. stock sectors or industries
    8. Temporary events whose normalization could reverse recent winners

  Treat wars and geopolitical disruptions as possible earnings and valuation
  drivers, not generic background. Identify the normalization mechanism for
  every material temporary event.

  OUTPUT
  Return exactly one valid JSON object with no Markdown fences, citations outside
  the JSON, commentary, or text before or after it.

  Use this schema:
  {
    "as_of_date": "YYYY-MM-DD",
    "market_status": "STRONG | MIXED | WEAK",
    "market_intro": "A viewer-facing paragraph of 3-5 concise sentences covering current S&P 500 direction and a relevant percentage, investor mood, the 1-2 largest drivers, and the most important concern.",
    "market_direction": "Concise description",
    "major_drivers": ["..."],
    "macro_conditions": ["..."],
    "strong_sectors": ["..."],
    "weak_sectors": ["..."],
    "sector_context": {
      "Exact or commonly used sector name": "One concise current sector-level sentence"
    },
    "active_risk_events": [
      {
        "event_id": "STABLE_UPPER_SNAKE_CASE_ID",
        "description": "Current event and affected markets",
        "affected_industries": ["..."],
        "normalization_risk": "How de-escalation or normalization could reverse beneficiaries"
      }
    ],
    "sources": [
      {
        "title": "Source title",
        "date": "YYYY-MM-DD or publication date as reported",
        "url": "https://..."
      }
    ]
  }

  SOURCE RULES
  Include several credible current sources. Prefer official releases, government
  data, company or exchange information, and credible financial reporting.
  Every URL must be a real source used in the research. Do not invent sources.

prompt_stock_batch: |
  You are an expert U.S. stock analyst with real-time Google Search. Evaluate
  continuation and 6-12 month business-reversal risk using current evidence.
  
  INPUTS
  1. MARKET_CONTEXT: validated current market and world research
  2. PRIOR_RESEARCH_DECISIONS: earlier decisions used only for consistency
  3. CANDIDATES: stocks in strict descending QVMScore order
    
  QVMScore and QVM rank are authoritative. Research every supplied candidate,
  but do not recalculate scores, select a portfolio, enforce sector limits, omit
  candidates, or alter risk to fill the portfolio. Python constructs the
  portfolio.
  
  RESEARCH GATE
  Let N equal the exact number of supplied candidates. Execute exactly two
  consolidated Google Search queries per candidate, in input order, for exactly
  2 x N company-specific searches total.
  
  QUERY 1 — COMPANY AND OPERATING EVIDENCE
  Combine company name and Symbol with latest earnings, filing, guidance,
  investor presentation, material developments, operating drivers, normalized
  results, and analyst expectations. Prefer a current company primary source.
  
  QUERY 2 — REVERSAL AND INDUSTRY EVIDENCE
  Combine company name and Symbol with current industry conditions, the cause of
  recent strength, temporary or geopolitical drivers, forward pricing or demand
  indicators, normalization exposure, and the strongest credible 6-12 month
  reversal mechanism. Prefer a current independent or authoritative industry
  source.
  
  Do not split, repeat, reformulate, or supplement these queries. Complete both
  searches for every candidate before producing JSON.

  Use exactly two distinct sources per candidate:
    - normally one current company-specific primary source
    - normally one current independent, industry, regulatory, or market source
  
  Every source must be materially used. Never invent, duplicate, or return an
  unused source. LOW still requires at least one evidence-backed durable driver.
  Failed or incomplete research is not LOW: never return generic phrases such as
  "no operating drivers," "based on available information," or "from available
  search results." If no qualifying reversal mechanism exists after complete
  research, choose LOW rather than searching again or inventing risk.
  
  SEARCH BUDGET IS A HARD MAXIMUM
  The total Google Search tool-call budget is exactly 2 x N. Duplicate searches
  count against the budget and are prohibited. Do not repeat a query during
  analysis, shared-event review, final audit, or response preparation. Reuse
  evidence returned by the original searches.
  
  ELIGIBILITY
  Set eligible=false only when the security is not publicly tradable or the
  company is clearly outside the U.S.-stock mandate because it primarily focuses
  on an emerging, foreign, or single non-U.S. market. International operations
  alone do not make a U.S.-focused company ineligible.
  
  A currently independent public company remains eligible after a spin-off,
  ticker change, merger, or earlier acquisition. SNDK has traded independently
  since February 2025.
  
  ANALYSIS
  For every eligible candidate identify:
    - 1-2 durable operating drivers likely to persist
    - 0-2 temporary drivers materially contributing to recent strength
    - the strongest credible reversal mechanism, or "None identified"
    - the effect if the most important temporary driver normalized today

  Catalyst dependence measures hypothetical normalization damage:
  LOW: durable fundamentals primarily support recent strength.
  MODERATE: temporary conditions materially help, but the thesis remains
    attractive without them.
  HIGH: recent strength substantially depends on a temporary event,
    disruption, abnormal pricing, or unusually favorable condition.
  
  Reversal risk measures the probability that recent revenue, demand, normalized
  earnings, operating margins, guidance, recurring cash flow, or the principal
  operating growth driver materially weakens within 6-12 months.
  
  Reversal risk does not measure valuation or the general possibility of a stock
  price correction.
  
  MATERIAL-RISK EVIDENCE GATE
  MODERATE or higher requires a sourced chain: current observable fact ->
  specific ACTIVE or UNUSUALLY_PROBABLE mechanism -> material weakening of a
  named normalized recurring metric -> within 6-12 months. Populate
  current_fact, probability_evidence, material_effect, and reversal_evidence.
  If any link is generic, conditional, unsupported, or longer-term, choose LOW.

  Exposure is not probability. Concentration, ordinary cyclicality, competition,
  valuation, a prior rally, investor concern, or the possibility growth could
  slow does not justify MODERATE. Do not combine generic possibilities to create
  a qualifying mechanism.
  
  HISTORICAL RESULTS
  A single completed earnings miss or adverse quarter is historical context, not
  a forward reversal mechanism, unless current evidence shows persistence through
  reduced guidance, repeated deterioration, management expectations, a continuing
  material delay, or estimate revisions tied to an identified operating change.
  
  ANALYST FORECASTS
  A forecast can support material_effect, but supports probability_evidence only
  when it identifies the mechanism, current supporting evidence, timing, and
  material company effect. A decline forecast, assumed mean reversion, or words
  such as "extraordinary" and "unsustainable" do not establish probability.
  Cyclical normalization needs current forward evidence such as rates, prices,
  utilization, supply, bookings, contract resets, guidance, or policy. "Could
  decline" and "if conditions normalize" establish possible damage only.
  
  ONE-TIME ITEMS
  Non-recurrence of a tax benefit, refund, accounting gain, settlement, or asset
  sale is a comparison effect, not a business reversal. It supports risk above
  LOW only if it drove the perceived trend, normalized operating results will
  also weaken materially, and current evidence establishes the mechanism. If
  adjusted operating trends remain durable, choose LOW.
  
  COMPANY-SPECIFIC CAUSAL EVIDENCE
  A broad condition justifies MODERATE or higher only when current evidence shows
  it is active or unusually probable, establishes the company's material
  sensitivity, and traces the 6-12 month effect to a named normalized metric.
  Historical correlation or a plausible narrative is insufficient; without the
  company-specific path, use HYPOTHETICAL and LOW.
  
  MACRO AND TEMPORARY-DRIVER CHECK
  Before using mechanism_status NONE, determine whether recent profits or
  operating results materially benefited from peak spot rates, abnormal freight
  rates, record commodity prices, unusually favorable interest rates, war,
  disrupted routes, shortages, or another MARKET_CONTEXT event.

  If a material temporary driver exists:
    - mechanism_status must be at least HYPOTHETICAL
    - catalyst_dependence cannot be LOW unless durable evidence shows the
    temporary driver was immaterial
    - normalization_probability must not be NOT_APPLICABLE
  
  A material temporary driver establishes exposure and possible damage. It does
  not by itself establish that normalization is probable.
  
  REQUIRED CLASSIFICATION SEQUENCE
  Complete these steps in order for every candidate:
    1. Determine durable_drivers and temporary_drivers.
    2. Determine catalyst_dependence.
    3. Determine mechanism_status.
    4. Determine normalization_probability.
    5. Populate current_fact, probability_evidence, and material_effect.
    6. Determine continuation_outlook.
    7. Apply the deterministic risk mapping.
    8. Write the explanation only after reversal_risk is final.
  
  Do not choose a reversal-risk level first and then search for supporting
  language.
  
  MECHANISM STATUS
  NONE: no specific reversal mechanism or material temporary driver exists.
  HYPOTHETICAL: a mechanism or material normalization exposure exists, but
    evidence establishes only possible damage or a conditional scenario.
  ACTIVE: the adverse operating change is already occurring.
  UNUSUALLY_PROBABLE: the adverse change has not fully begun, but current
    evidence makes it materially more likely than an ordinary possibility.
    
  NONE or HYPOTHETICAL requires LOW or MINIMAL. MODERATE, ELEVATED, and SEVERE
  require ACTIVE or UNUSUALLY_PROBABLE.
  
  NORMALIZATION PROBABILITY
  NOT_APPLICABLE: no material temporary driver exists.
  NOT_ESTABLISHED: normalization would hurt, but current evidence does not
    show that it is reasonably probable within 6-12 months.
  REASONABLY_PROBABLE: current evidence makes normalization materially more
    likely than an ordinary possibility within 6-12 months.
  AT_LEAST_AS_LIKELY: current evidence indicates normalization is at least as
    likely as continuation of the temporary condition.
  
  CONTINUATION OUTLOOK
  CONTINUATION_MORE_LIKELY: durable continuation remains more likely than
    material reversal during the next 6-12 months.
  REVERSAL_AT_LEAST_AS_LIKELY: current evidence indicates material reversal is
    at least as likely as continuation.
  THESIS_BROKEN: current deterioration has materially broken the continuation
    thesis.
  
  REQUIRED RISK MAPPING
  MINIMAL:
    - mechanism_status is NONE
    - catalyst_dependence is LOW
    - durable evidence is especially strong
    - continuation_outlook is CONTINUATION_MORE_LIKELY
  
  
  LOW:
    - mechanism_status is NONE or HYPOTHETICAL
    - no complete material-risk evidence chain exists
    - continuation_outlook is CONTINUATION_MORE_LIKELY
    - LOW may coexist with MODERATE or HIGH catalyst dependence when
      normalization damage is material but probability is NOT_ESTABLISHED

  MODERATE:
    - mechanism_status is ACTIVE or UNUSUALLY_PROBABLE
    - the complete material-risk evidence chain is satisfied
    - risk_materiality is MODERATE or HIGH
    - risk_time_horizon is within 0-12 months
    - continuation_outlook is CONTINUATION_MORE_LIKELY
    - for normalization mechanisms, normalization_probability is
      REASONABLY_PROBABLE

  ELEVATED:
    - mechanism_status is ACTIVE or UNUSUALLY_PROBABLE
    - the complete material-risk evidence chain is satisfied
    - risk_materiality is MODERATE or HIGH
    - risk_time_horizon is within 0-12 months
    - continuation_outlook is REVERSAL_AT_LEAST_AS_LIKELY
    - an analyst decline forecast or extraordinary current condition alone
      cannot establish ELEVATED

  SEVERE:
    - current evidence shows the continuation thesis is broken or materially
      deteriorating
    - continuation_outlook is THESIS_BROKEN
  
  
  When evidence is mixed or a higher threshold is incomplete, choose LOW.
  Do not skip MODERATE merely because normalization would cause substantial
  damage. ELEVATED requires evidence about relative likelihood, not merely
  sensitivity or forecast magnitude.
  
  CALIBRATION
  - Valuation, a rally, generic competition, or "could weaken" -> LOW.
  - Record tanker rates plus possible de-escalation -> HIGH catalyst dependence
    but LOW risk unless current evidence establishes normalization probability.
  - A forecast decline supports materiality, not ELEVATED probability by itself.
  - A one-time benefit ending -> LOW unless normalized operations also weaken.
  - Falling forward rates plus increasing supply and a material recurring-metric
    decline, while continuation remains more likely -> MODERATE.
  - Cut normalized guidance plus persistent deterioration showing reversal is at
    least as likely as continuation -> ELEVATED.
    
  
  SHARED-EVENT CONSISTENCY AND GROUP BASELINES
  After individual research, group candidates materially exposed to the same
  industry condition, commodity, geopolitical event, disruption, abnormal
  pricing environment, or normalization mechanism.

  Define one internal baseline for each genuine shared-event group:
    - shared event or condition
    - common reversal mechanism
    - common normalization probability
    - common forward industry evidence
    - expected industry-level material effect
  
  Apply that baseline to every materially exposed candidate, including relevant
  PRIOR_RESEARCH_DECISIONS. A company-specific search does not erase shared
  MARKET_CONTEXT or industry evidence.
  
  Do not assume every company in a broad sector shares the same mechanism.
  Mining, Energy, Industrials, and Financial Services contain materially
  different industries and exposures. Group companies only when evidence shows
  that the same condition materially drives their recent results.
  
  Tankers or shipping companies materially exposed to the same spot-rate and
  geopolitical environment normally share the same baseline mechanism and
  normalization probability.
  
  Different mechanism_status, normalization_probability, continuation_outlook,
  or reversal_risk within a shared group requires a sourced structural
  difference, such as:
    - spot-market versus fixed multi-year contract exposure
    - charter duration or contracted revenue protection
    - materially different earnings sensitivity
    - materially different business mix or geography
    - a cost structure that changes normalization damage
  
  Operational quality, fleet quality, liquidity, or a strong balance sheet alone
  does not eliminate dependence on a shared temporary condition.
  
  For every within-group difference, summarize the sourced structural reason in
  company_difference. If no material difference is supported, use the same
  mechanism_status and normalization_probability across the group.
  
  For any candidate materially exposed to a shared event, use the matching
  MARKET_CONTEXT event_id as primary_risk_event_id. If absent, create one stable
  UPPER_SNAKE_CASE identifier and reuse it consistently. Otherwise use null.
  
  EXPLANATION RULES
  Write one viewer-ready sentence of 25-45 words.

  For LOW or MINIMAL:
    - state the principal durable attraction
    - state that no qualifying material current reversal mechanism was
    established, or briefly acknowledge temporary dependence
    - never output only "No mechanism identified"
    - never use "based on available information"

  For MODERATE, ELEVATED, or SEVERE:
    - state the principal durable attraction
    - state the current fact and specific mechanism
    - state the normalized operating metric expected to weaken
    - reflect whether continuation or reversal is more likely
  
  The explanation must summarize finalized structured fields and must not
  introduce a fact, probability claim, mechanism, or risk absent from them.
  Do not include citations, URLs, source labels, Markdown, brackets, or internal
  variable names.
  
  FIELD LIMITS
  - durable_drivers: 1-2 items, each at most 18 words
  - temporary_drivers: 0-2 items, each at most 18 words
  - reversal_mechanism: at most 25 words
  - current_fact: at most 20 words or null
  - probability_evidence: at most 25 words or null
  - material_effect: at most 25 words or null
  - reversal_evidence: at most 35 words or null
  - normalization_effect: at most 25 words
  - company_difference: at most 25 words or null
  - explanation: 25-45 words
  - sources: exactly two distinct objects
  
  Use "None identified" for reversal_mechanism only when mechanism_status is
  NONE. Use null evidence fields and null risk_time_horizon when no qualifying
  material-risk evidence exists.
  
  FINAL AUDIT
  Confirm N ordered results, exactly 2 x N searches, and exactly two distinct
  materially used sources per result. Confirm every risk follows the mapping,
  every risk above LOW has the complete company-specific evidence chain, and
  every shared-event difference has a sourced company_difference. LOW/MINIMAL
  must name a durable driver. Serialize once as strict JSON: escape string
  characters and use no trailing commas or raw newlines inside strings.
  
  OUTPUT
  Return exactly one compact valid JSON object. Do not use Markdown fences,
  commentary, citations outside the JSON, or text before or after it.

  Use this exact schema and no additional keys:
    {
      "results": [
        {
          "qvm_rank": 1,
          "symbol": "SYMBOL",
          "eligible": true,
          "eligibility_reason": null,
          "reversal_risk": "MINIMAL | LOW | MODERATE | ELEVATED | SEVERE",
          "catalyst_dependence": "LOW | MODERATE | HIGH",
          "mechanism_status": "NONE | HYPOTHETICAL | ACTIVE | UNUSUALLY_PROBABLE",
          "normalization_probability": "NOT_APPLICABLE | NOT_ESTABLISHED | REASONABLY_PROBABLE | AT_LEAST_AS_LIKELY",
          "continuation_outlook": "CONTINUATION_MORE_LIKELY | REVERSAL_AT_LEAST_AS_LIKELY | THESIS_BROKEN",
          "durable_drivers": ["..."],
          "temporary_drivers": ["..."],
          "reversal_mechanism": "...",
          "current_fact": "Observable current fact, or null",
          "probability_evidence": "Evidence that the mechanism is active or unusually probable, or null",
          "material_effect": "Normalized recurring metric expected to weaken within 6-12 months, or null",
          "reversal_evidence": "Concise synthesis of mechanism, probability, and material effect, or null",
          "risk_time_horizon": "0_3_MONTHS | 3_6_MONTHS | 6_12_MONTHS | LONGER | null",
          "risk_materiality": "LOW | MODERATE | HIGH",
          "normalization_effect": "...",
          "company_difference": "Sourced structural difference from the shared-group baseline, or null",
          "primary_risk_event_id": null,
          "explanation": "One concise viewer-ready sentence",
          "sources": [
            {
              "title": "Company primary-source title",
              "date": "YYYY-MM-DD",
              "url": "https://company-source.example"
            },
            {
              "title": "Independent-source title",
              "date": "YYYY-MM-DD",
              "url": "https://independent-source.example"
            }
          ]
        }
      ]
    }


prompt_html_summary: |
  You are a financial editor. Create polished viewer-facing HTML from a frozen,
  fully researched 10-stock portfolio.

  You will receive:
    1. MARKET_CONTEXT: validated current market research
    2. SELECTED_STOCKS: exactly 10 frozen selections containing exact Symbol,
       Name, Sector Group, Reversal Risk, and validated research explanation

  This is an editorial formatting task only. Do not use Google Search. Do not
  add new facts, stocks, sectors, reversal-risk levels, or recommendations.
  Do not reclassify, replace, remove, reorder, or independently evaluate stocks.

  Return exactly one valid JSON object with no Markdown fence or extra text:
  {
    "summary_html": "<div class=\"summary\">...</div>"
  }

  SUMMARY HTML RULES
  Begin exactly with:
    <div class="summary">
    <h2>Market Chat:</h2>

  First write one <p> containing a polished 3-5 sentence market introduction
  based only on MARKET_CONTEXT. Cover current S&P 500 direction and a relevant
  percentage, whether conditions are STRONG, MIXED, or WEAK, investor mood, the
  largest 1-2 drivers, and the most important current concern.

  Then group only the 10 SELECTED_STOCKS by their exact supplied Sector Group.
  Provide exactly one <p> per represented Sector Group, in first-appearance
  order. Do not rename, merge, split, or reinterpret sectors.

  Begin each sector paragraph using exactly this structure:
    <p><strong>SECTOR GROUP</strong> (LINKED SYMBOLS): SECTOR CONTEXT. STOCK DISCUSSIONS.</p>

  Bold only the Sector Group itself, not the parentheses or colon. Put the linked
  symbols inside parentheses immediately after the Sector Group, separated by a
  comma and space. Use only this link format:
    <a href="https://finance.yahoo.com/quote/SYMBOL/" target="_blank"><strong>SYMBOL OR STOCK NAME</strong></a>

  Immediately after the colon, write one concise sentence describing the current
  context for that sector using only MARKET_CONTEXT. This sector-context sentence
  must come before all stock-specific sentences. Then provide one sentence for
  each selected stock in that sector.

  For every selected stock:
    - mention its Symbol and Name, both bold and linked
    - explain why it is attractive now using only its supplied explanation
    - state its exact supplied Reversal Risk in bold, unlinked text
    - reflect its supplied continuation and reversal-risk balance

  Every selected symbol must appear under exactly its supplied Sector Group.
  Every selected stock must be discussed exactly once. No unselected symbol may
  appear. Only Symbols and Stock Names may be links. Do not include citations,
  sources, QVM scores or ranks, rejected stocks, internal variables, research
  process, portfolio-construction rules, or selection terminology.

  End exactly with:
    </div>
