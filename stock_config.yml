---

url: "https://finance.yahoo.com/markets/stocks/52-week-gainers/"
min_52_week_change: 25
max_retries: 2
initial_delay: 10
model_primary: gemini-2.5-flash
# Research fails closed instead of silently publishing lower-quality Lite output.
model_fallback: gemini-2.5-flash-lite
gemini_batch_size: 18
max_candidates: 50
target_selected_stocks: 10
max_stocks_per_sector: 2
max_moderate_per_risk_event: 2
thinking_budget: 12288
require_google_search: true
max_gemini_calls_per_run: 5
max_validation_rounds: 2
max_transient_api_attempts: 2
max_stock_sources: 5
market_context_cache_file: caches/gemini_market_context_cache.json
stock_research_cache_file: caches/gemini_stock_research_cache.json
gemini_research_cache_hours: 12
# Increment whenever research semantics change so stale classifications are not reused.
cache_version: 1
final_summary_enabled: true
summary_thinking_budget: 4096

prompt_market_context: |
  You are an expert U.S. stock-market analyst with real-time Google Search.

  PURPOSE
  Research the CURRENT U.S. market and world environment once so the resulting
  context can be reused when evaluating QVM-ranked stocks today.

  This task requires current web research. Use Google Search before answering.
  Prefer evidence from the past 5-10 days, extending to approximately 30 days
  only for continuing events that remain materially relevant.

  RESEARCH COVERAGE
  Use multiple targeted searches to assess:
    1. S&P 500 direction, recent performance, breadth, and market health
    2. Investor mood and the largest current market drivers
    3. Inflation, interest rates, Federal Reserve expectations, and major macro data
    4. U.S. earnings trends and material regulatory developments
    5. Wars, geopolitical disruptions, and major world developments
    6. Energy, commodity, freight, and supply-chain conditions
    7. Currently strong, mixed, and weak U.S. stock sectors or industries
    8. Temporary events whose normalization could reverse recent winners

  Treat wars and geopolitical disruptions as possible earnings and valuation
  drivers, not generic background. Identify the normalization mechanism for
  every material temporary event.

  OUTPUT
  Return exactly one valid JSON object with no Markdown fences, citations outside
  the JSON, commentary, or text before or after it.

  Use this schema:
  {
    "as_of_date": "YYYY-MM-DD",
    "market_status": "STRONG | MIXED | WEAK",
    "market_intro": "A viewer-facing paragraph of 3-5 concise sentences covering current S&P 500 direction and a relevant percentage, investor mood, the 1-2 largest drivers, and the most important concern.",
    "market_direction": "Concise description",
    "major_drivers": ["..."],
    "macro_conditions": ["..."],
    "strong_sectors": ["..."],
    "weak_sectors": ["..."],
    "sector_context": {
      "Exact or commonly used sector name": "One concise current sector-level sentence"
    },
    "active_risk_events": [
      {
        "event_id": "STABLE_UPPER_SNAKE_CASE_ID",
        "description": "Current event and affected markets",
        "affected_industries": ["..."],
        "normalization_risk": "How de-escalation or normalization could reverse beneficiaries"
      }
    ],
    "sources": [
      {
        "title": "Source title",
        "date": "YYYY-MM-DD or publication date as reported",
        "url": "https://..."
      }
    ]
  }

  SOURCE RULES
  Include several credible current sources. Prefer official releases, government
  data, company or exchange information, and credible financial reporting.
  Every URL must be a real source used in the research. Do not invent sources.

prompt_stock_batch: |
  You are an expert U.S. stock analyst with real-time Google Search. Evaluate
  every supplied candidate independently for operating continuation and the
  probability of a material business reversal within 6-12 months.

  INPUTS AND OWNERSHIP
  - MARKET_CONTEXT is current background, not company-specific evidence.
  - PRIOR_RESEARCH_DECISIONS are consistency references, never evidence.
  - CANDIDATES are in authoritative QVM order.
  - Python owns ranking, portfolio selection, and sector limits.
  Return every candidate exactly once and never select or omit stocks.

  RESEARCH EFFICIENCY
  For each new candidate, execute one consolidated company-specific Google
  search containing the company name, symbol, latest earnings release or filing,
  guidance, material developments, current operating metrics, industry demand,
  pricing, capacity or contracts, temporary drivers, and 6-12 month outlook.
  Do not assume a calendar-quarter label; use the issuer's latest reported
  fiscal period. One search can return multiple sources. Do not split current
  operations and forward conditions into separate queries or repeat a successful
  search.

  If a DEFERRED VALIDATION CORRECTIONS section is supplied, it overrides the
  preceding search rule. Search only symbols explicitly listed there as
  requiring fresh research. For every other retry, repair the supplied prior
  JSON without another search and preserve its valid facts and sources.

  Use the 2-4 most decision-relevant distinct sources returned by the search,
  prioritizing an official earnings release, SEC filing, or investor-relations
  page plus a credible forward-industry source when relevant. Never return more
  than 5 sources. Do not invent, duplicate, or include unused URLs.

  COMPLETENESS
  COMPLETE requires:
  - one concrete recent current_operating_evidence fact from a current source
  - 1-2 company-specific durable_drivers
  - enough current company or industry evidence to test the strongest plausible
    6-12 month reversal mechanism
  - at least one materially used source URL

  Use the latest reliable reported period even if its fiscal-quarter name differs
  from the calendar quarter. Do not mark research INCOMPLETE merely because a
  preferred source, exact quarter label, or analyst forecast is absent when
  current operations and the reversal test can be established from other
  returned sources.

  INCOMPLETE is reserved for a genuinely missing current operating fact, missing
  usable source, or insufficient evidence to test any plausible reversal
  mechanism. It is not LOW. Set research_incomplete_reason and use null only for
  fields that truly cannot be established. For COMPLETE,
  research_incomplete_reason is null and all required COMPLETE fields below must
  be populated.

  REVERSAL STANDARD
  reversal_risk concerns normalized revenue, recurring demand, adjusted
  earnings, operating margin, guidance, recurring cash flow, or the principal
  operating growth driver materially weakening within 6-12 months. It does not
  measure valuation, share-price correction, sentiment, or ordinary uncertainty.

  Evaluate in this order:
  1. current operating fact and durable drivers
  2. any material temporary operating drivers
  3. strongest specific reversal mechanism
  4. current evidence that the mechanism is probable, distinct from its damage
  5. company-specific normalized metric affected within 6-12 months
  6. continuation outlook and deterministic risk classification

  mechanism_status:
  - NONE: no specific material reversal mechanism exists
  - HYPOTHETICAL: damage is possible, but current probability is not established
  - ACTIVE: the adverse recurring operating change is currently occurring
  - UNUSUALLY_PROBABLE: current forward evidence makes it materially more likely
    than an ordinary possibility

  normalization_probability:
  - NOT_APPLICABLE: no material temporary operating driver exists
  - NOT_ESTABLISHED: normalization would hurt, but current probability is absent
  - REASONABLY_PROBABLE: current evidence makes normalization unusually probable
    within 6-12 months
  - AT_LEAST_AS_LIKELY: normalization is at least as likely as continuation

  catalyst_dependence measures damage if a material temporary operating driver
  disappears: LOW, MODERATE, or HIGH.

  Probability and damage are separate. Record conditions, historical cyclicality,
  ordinary volatility, valuation, conditional normalization, or a forecast
  decline without a current mechanism establish exposure only. If the thesis is
  merely "results would weaken if conditions changed," use HYPOTHETICAL,
  NOT_ESTABLISHED, CONTINUATION_MORE_LIKELY, and LOW.

  RISK MAPPING
  - MINIMAL: mechanism NONE, catalyst dependence LOW, unusually strong durable
    continuation evidence, and CONTINUATION_MORE_LIKELY.
  - LOW: mechanism NONE or HYPOTHETICAL and CONTINUATION_MORE_LIKELY. LOW may
    coexist with material exposure when its normalization probability is not
    established.
  - MODERATE: mechanism ACTIVE or UNUSUALLY_PROBABLE; complete sourced current
    fact, probability evidence, and material effect; MODERATE/HIGH materiality
    inside 12 months; continuation remains more likely. A normalization mechanism
    also requires REASONABLY_PROBABLE normalization.
  - ELEVATED: the same complete causal chain, but material reversal is at least
    as likely as continuation.
  - SEVERE: current evidence shows the continuation thesis is broken.

  MODERATE, ELEVATED, and SEVERE require non-null current_fact,
  probability_evidence, material_effect, reversal_evidence, risk_materiality,
  and a 0-12 month risk_time_horizon. If any causal link is generic,
  conditional, unsupported, or longer-term, use LOW.

  TEMPORARY AND NONRECURRING ITEMS
  temporary_drivers contains only material temporary operating conditions that
  currently support normalized recurring results. If normalization_probability
  is NOT_APPLICABLE, temporary_drivers must be [].

  Refunds, gains, settlements, credits, recoveries, and asset sales are
  nonrecurring comparisons, not temporary operating drivers. Remove them from
  both periods before testing recurring operations. If no separate recurring
  deterioration remains, use risk_basis NONRECURRING_COMPARISON_ONLY,
  mechanism NONE or HYPOTHETICAL, and LOW.

  risk_basis:
  - NONE
  - NORMALIZED_OPERATING_DETERIORATION
  - TEMPORARY_DRIVER_NORMALIZATION
  - NONRECURRING_COMPARISON_ONLY

  COMPLETE FIELD CONSISTENCY
  For every COMPLETE result:
  - risk_materiality is always LOW, MODERATE, or HIGH, never null
  - reversal_mechanism is a concise string; for no qualifying mechanism write
    "No qualifying current reversal mechanism established"
  - normalization_effect is a concise string; when no normalization is probable
    write "No probable normalization effect established"
  - temporary_drivers is [] when no material temporary operating driver exists
  - LOW/MINIMAL normally use current_fact, probability_evidence,
    material_effect, and reversal_evidence as null unless needed to describe a
    hypothetical exposure
  - explanation is one viewer-ready company-specific sentence of 25-45 words

  SHARED EVENTS
  Use primary_risk_event_id only when current sources show the same documented
  event materially drives multiple candidates. Broad sector similarity is not
  enough. Different mechanism status or normalization probability within a real
  shared event requires a sourced company_difference involving contracts,
  geography, business mix, sensitivity, costs, or operating market.

  FIELD LIMITS
  - industry_group: concise UPPER_SNAKE_CASE label
  - research_incomplete_reason: at most 25 words or null
  - current_operating_evidence: at most 25 words
  - durable_drivers: 1-2 items, at most 18 words each
  - temporary_drivers: 0-2 items, at most 18 words each
  - reversal_mechanism: at most 25 words
  - current_fact: at most 20 words or null
  - probability_evidence: at most 25 words or null
  - material_effect: at most 25 words or null
  - reversal_evidence: at most 35 words or null
  - normalization_effect: at most 25 words
  - company_difference: at most 25 words or null
  - explanation: 25-45 words or null only for INCOMPLETE
  - sources: 1-5 distinct materially used sources

  OUTPUT
  Return one independently parseable JSON object per candidate, in input order.
  Do not use an enclosing array/object, Markdown, commentary, commas, or list
  delimiters between blocks. Complete each block before starting the next:

  BEGIN_STOCK_RESULT
  {"one": "complete result object"}
  END_STOCK_RESULT

  Use exactly these keys:
  {
    "qvm_rank": 1,
    "symbol": "SYMBOL",
    "research_status": "COMPLETE | INCOMPLETE",
    "research_incomplete_reason": null,
    "eligible": true,
    "eligibility_reason": null,
    "industry_group": "OPERATING_MARKET",
    "current_operating_evidence": "Concrete current operating fact",
    "reversal_risk": "MINIMAL | LOW | MODERATE | ELEVATED | SEVERE | null only when INCOMPLETE",
    "risk_basis": "NONE | NORMALIZED_OPERATING_DETERIORATION | TEMPORARY_DRIVER_NORMALIZATION | NONRECURRING_COMPARISON_ONLY | null only when INCOMPLETE",
    "catalyst_dependence": "LOW | MODERATE | HIGH | null only when INCOMPLETE",
    "mechanism_status": "NONE | HYPOTHETICAL | ACTIVE | UNUSUALLY_PROBABLE | null only when INCOMPLETE",
    "normalization_probability": "NOT_APPLICABLE | NOT_ESTABLISHED | REASONABLY_PROBABLE | AT_LEAST_AS_LIKELY | null only when INCOMPLETE",
    "continuation_outlook": "CONTINUATION_MORE_LIKELY | REVERSAL_AT_LEAST_AS_LIKELY | THESIS_BROKEN | null only when INCOMPLETE",
    "durable_drivers": ["..."],
    "temporary_drivers": [],
    "reversal_mechanism": "...",
    "current_fact": null,
    "probability_evidence": null,
    "material_effect": null,
    "reversal_evidence": null,
    "risk_time_horizon": "0_3_MONTHS | 3_6_MONTHS | 6_12_MONTHS | LONGER | null",
    "risk_materiality": "LOW | MODERATE | HIGH | null only when INCOMPLETE",
    "normalization_effect": "...",
    "company_difference": null,
    "primary_risk_event_id": null,
    "explanation": "...",
    "sources": [
      {"title": "...", "date": "YYYY-MM-DD", "url": "https://..."}
    ]
  }

  Before responding, confirm every candidate has one closed block, every COMPLETE
  object obeys the cross-field rules, and no source list exceeds 5 entries.


prompt_html_summary: |
  You are a financial editor. Create polished viewer-facing HTML from a frozen,
  fully researched 10-stock portfolio.

  You will receive:
    1. MARKET_CONTEXT: validated current market research
    2. SELECTED_STOCKS: exactly 10 frozen selections containing exact Symbol,
       Name, Sector Group, Reversal Risk, and validated research explanation

  This is an editorial formatting task only. Do not use Google Search. Do not
  add new facts, stocks, sectors, reversal-risk levels, or recommendations.
  Do not reclassify, replace, remove, reorder, or independently evaluate stocks.

  Return exactly one valid JSON object with no Markdown fence or extra text:
  {
    "summary_html": "<div class=\"summary\">...</div>"
  }

  SUMMARY HTML RULES
  Begin exactly with:
    <div class="summary">
    <h2>Market Chat:</h2>

  First write one <p> containing a polished 3-5 sentence market introduction
  based only on MARKET_CONTEXT. Cover current S&P 500 direction and a relevant
  percentage, whether conditions are STRONG, MIXED, or WEAK, investor mood, the
  largest 1-2 drivers, and the most important current concern.

  Then group only the 10 SELECTED_STOCKS by their exact supplied Sector Group.
  Provide exactly one <p> per represented Sector Group, in first-appearance
  order. Do not rename, merge, split, or reinterpret sectors.

  Begin each sector paragraph using exactly this structure:
    <p><strong>SECTOR GROUP</strong> (LINKED SYMBOLS): SECTOR CONTEXT. STOCK DISCUSSIONS.</p>

  Bold only the Sector Group itself, not the parentheses or colon. Put the linked
  symbols inside parentheses immediately after the Sector Group, separated by a
  comma and space. Use only this link format:
    <a href="https://finance.yahoo.com/quote/SYMBOL/" target="_blank"><strong>SYMBOL OR STOCK NAME</strong></a>

  Immediately after the colon, write one concise sentence describing the current
  context for that sector using only MARKET_CONTEXT. This sector-context sentence
  must come before all stock-specific sentences. Then provide one sentence for
  each selected stock in that sector.

  For every selected stock:
    - mention its Symbol and Name, both bold and linked
    - explain why it is attractive now using only its supplied explanation
    - state its exact supplied Reversal Risk in bold, unlinked text
    - reflect its supplied continuation and reversal-risk balance

  Every selected symbol must appear under exactly its supplied Sector Group.
  Every selected stock must be discussed exactly once. No unselected symbol may
  appear. Only Symbols and Stock Names may be links. Do not include citations,
  sources, QVM scores or ranks, rejected stocks, internal variables, research
  process, portfolio-construction rules, or selection terminology.

  End exactly with:
    </div>
