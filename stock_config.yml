#
#  Use current evidence rather than relying primarily on historical information.
#
#  Search specifically for the company and its current issues.
#
#  Use multiple credible current sources when an issue is material or conflicting.
#
#  Give greater weight to:
#    - recent credible reporting
#    - company filings and statements
#    - earnings and guidance
#    - credible financial reporting
#    - direct evidence of industry conditions
#
#  Do not allow one sensational headline to determine a classification without
