---

url: "https://finance.yahoo.com/markets/stocks/52-week-gainers/"
min_52_week_change: 25
max_retries: 2
initial_delay: 10
model_primary: gemini-2.5-flash
# Research fails closed instead of silently publishing lower-quality Lite output.
model_fallback: gemini-2.5-flash-lite
gemini_batch_size: 15
max_research_candidates_per_open_sector_slot: 3
max_candidates: 50
target_selected_stocks: 10
max_stocks_per_sector: 2
max_moderate_per_risk_event: 2
cautious_exposure_floor_enabled: true
cautious_exposure_floor_min_dependence: MODERATE
exclude_high_catalyst_dependence: true
excluded_crypto_dependence:
  - MATERIAL
  - PRIMARY
thinking_budget: 12288
require_google_search: true
max_gemini_calls_per_run: 7
max_stock_research_calls_per_run: 5
reserved_summary_calls: 1
max_validation_rounds: 4
max_research_attempts_per_stock: 2
# A deferred failure gets one fresh, batched chance in each later execution.
max_deferred_research_attempts_per_run: 1
max_structural_repairs_per_stock: 2
max_transient_api_attempts: 2
max_stock_sources: 5
market_context_cache_file: caches/gemini_market_context_cache.json
stock_research_cache_file: caches/gemini_stock_research_cache.json
gemini_research_cache_hours: 12
# Stock prompt content is hashed separately, so prompt edits invalidate stock
# research without unnecessarily invalidating a still-current market context.
cache_version: 4
final_summary_enabled: true
summary_thinking_budget: 4096

prompt_market_context: |
  You are an expert U.S. stock-market analyst with real-time Google Search.

  PURPOSE
  Research the CURRENT U.S. market and world environment once so the resulting
  context can be reused when evaluating QVM-ranked stocks today.

  This task requires current web research. Use Google Search before answering.
  Prefer evidence from the past 5-10 days, extending to approximately 30 days
  only for continuing events that remain materially relevant.

  RESEARCH COVERAGE
  Use multiple targeted searches to assess:
    1. S&P 500 direction, recent performance, breadth, and market health
    2. Investor mood and the largest current market drivers
    3. Inflation, interest rates, Federal Reserve expectations, and major macro data
    4. U.S. earnings trends and material regulatory developments
    5. Wars, geopolitical disruptions, and major world developments
    6. Energy, commodity, freight, and supply-chain conditions
    7. Currently strong, mixed, and weak U.S. stock sectors or industries
    8. Temporary events whose normalization could reverse recent winners

  Treat wars and geopolitical disruptions as possible earnings and valuation
  drivers, not generic background. Identify the normalization mechanism for
  every material temporary event.

  MARKET AND SECTOR WRITING QUALITY
  - market_intro must include at least one explicit S&P 500 percentage and the
    period measured.
  - Separate positive market supports from negative pressures. Never describe
    cautious or bearish sentiment as being caused by positive earnings or
    investment.
  - State Federal Reserve actions as market expectations unless an official
    decision has occurred. Persistent inflation alone does not establish that a
    rate increase is expected.
  - Every sector_context value must identify a specific current operating,
    demand, pricing, regulatory, or financing condition. Never use generic
    filler such as "most sectors are weak," "conditions are mixed," or "the
    sector remains relevant."
  - Cover every sector named in REQUIRED_SECTOR_GROUPS when that section is
    supplied by Python.

  OUTPUT
  Return exactly one valid JSON object with no Markdown fences, citations outside
  the JSON, commentary, or text before or after it.

  Use this schema:
  {
    "as_of_date": "YYYY-MM-DD",
    "market_status": "STRONG | MIXED | WEAK",
    "market_intro": "A viewer-facing paragraph of 3-5 concise sentences covering current S&P 500 direction and a relevant percentage, investor mood, the 1-2 largest drivers, and the most important concern.",
    "market_direction": "Concise description",
    "major_drivers": ["..."],
    "macro_conditions": ["..."],
    "strong_sectors": ["..."],
    "weak_sectors": ["..."],
    "sector_context": {
      "Exact or commonly used sector name": "One concise current sector-level sentence"
    },
    "active_risk_events": [
      {
        "event_id": "STABLE_UPPER_SNAKE_CASE_ID",
        "description": "Current event and affected markets",
        "affected_industries": ["..."],
        "normalization_risk": "How de-escalation or normalization could reverse beneficiaries"
      }
    ],
    "sources": [
      {
        "title": "Source title",
        "date": "YYYY-MM-DD or publication date as reported",
        "url": "https://..."
      }
    ]
  }

  SOURCE RULES
  Include several credible current sources. Prefer official releases, government
  data, company or exchange information, and credible financial reporting.
  Every URL must be a real source used in the research. Do not invent sources.

prompt_stock_batch: |
  You are an expert U.S. stock analyst with real-time Google Search. Evaluate
  every supplied candidate independently for operating continuation and the
  probability of a material business reversal within 6-12 months.

  INPUTS AND OWNERSHIP
  - MARKET_CONTEXT is current background, not company-specific evidence.
  - PRIOR_RESEARCH_DECISIONS are consistency references, never evidence.
  - CANDIDATES are in authoritative QVM order.
  - Python owns ranking, portfolio selection, and sector limits.
  Return every candidate exactly once and never select or omit stocks.

  RESEARCH EFFICIENCY
  For each new candidate, execute exactly one focused company-specific Google
  search using this compact pattern:
  "[Company Name] [Symbol] latest earnings results guidance operating metrics"
  Do not assume a calendar-quarter label; use the issuer's latest reported
  fiscal period. One search can return multiple sources. Do not issue follow-up,
  investor-relations, earnings-period, or alternative-query searches in the same
  response. The maximum search-query count equals the number of candidates
  explicitly requiring fresh research. If one search is insufficient, return
  INCOMPLETE rather than issuing another query.

  If a DEFERRED VALIDATION CORRECTIONS section is supplied, it overrides the
  preceding search rule. Search only symbols explicitly listed there as
  requiring fresh research, using exactly one focused query for the missing
  evidence. Prefer this pattern when current company facts or sources are absent:
  "[Company Name] [Symbol] investor relations latest results guidance"
  For every other retry, repair the supplied prior JSON without another search
  and preserve its valid facts and sources.

  Use the 2-4 most decision-relevant distinct sources returned by the search,
  prioritizing an official earnings release, SEC filing, or investor-relations
  page plus a credible forward-industry source when relevant. Never return more
  than 5 sources. Do not invent, duplicate, or include unused URLs.

  COMPLETENESS
  COMPLETE requires:
  - one concrete recent current_operating_evidence fact from a current source
  - a plain-English business_description and company-specific industry_context
  - 1-2 company-specific durable_drivers
  - enough current company or industry evidence to test the strongest plausible
    6-12 month reversal mechanism
  - at least one materially used source URL

  Use the latest reliable reported period even if its fiscal-quarter name differs
  from the calendar quarter. Do not mark research INCOMPLETE merely because a
  preferred source, exact quarter label, or analyst forecast is absent when
  current operations and the reversal test can be established from other
  returned sources.

  A concrete fact from the latest reliable reported period, such as revenue,
  recurring demand, production, shipments, realized pricing or TCE, utilization,
  margin, bookings, contracts, or guidance, satisfies current operating evidence.
  An uncertain forward outlook does not make research INCOMPLETE. When current
  operations are established but reversal probability is not, return COMPLETE
  with LOW risk.

  INCOMPLETE is reserved for a genuinely missing current operating fact, missing
  usable source, or insufficient evidence to test any plausible reversal
  mechanism. It is not LOW. Set research_incomplete_reason and use null only for
  fields that truly cannot be established. For COMPLETE,
  research_incomplete_reason is null and all required COMPLETE fields below must
  be populated.

  REVERSAL STANDARD
  reversal_risk concerns normalized revenue, recurring demand, adjusted
  earnings, operating margin, guidance, recurring cash flow, or the principal
  operating growth driver materially weakening within 6-12 months. It does not
  measure valuation, share-price correction, sentiment, or ordinary uncertainty.

  MARKET_CONTEXT supplies hypotheses and shared background only. It does not
  establish company-level reversal probability. Confirm a current probability
  indicator from candidate research before assigning MODERATE or higher.

  Evaluate in this order:
  1. current operating fact and durable drivers
  2. any material temporary operating drivers
  3. strongest specific reversal mechanism
  4. current evidence that the mechanism is probable, distinct from its damage
  5. company-specific normalized metric affected within 6-12 months
  6. continuation outlook and deterministic risk classification

  mechanism_status:
  - NONE: no company-specific reversal mechanism was identified
  - HYPOTHETICAL: a mechanism is plausible, but no current adverse change or
    measurable leading indicator establishes its probability
  - ACTIVE: reported recurring operations are already deteriorating on a
    comparable basis
  - UNUSUALLY_PROBABLE: a current measurable leading indicator establishes that
    a specific adverse operating change is likely within 6-12 months

  A reported recurring metric compares the company's actual operations with its
  own prior comparable period or current guidance. A result relative to an
  external expectation is not an operating change.

  normalization_probability:
  - NOT_APPLICABLE: no material temporary operating driver exists
  - NOT_ESTABLISHED: normalization would hurt, but current probability is absent
  - REASONABLY_PROBABLE: current evidence makes normalization unusually probable
    within 6-12 months
  - AT_LEAST_AS_LIKELY: normalization is at least as likely as continuation

  The existence of a temporary event establishes exposure, not the probability
  that it will end. REASONABLY_PROBABLE or AT_LEAST_AS_LIKELY requires current
  evidence that normalization has begun or become measurably more likely. Do not
  infer normalization probability merely because an event is temporary.

  catalyst_dependence measures damage if a material temporary operating driver
  disappears: LOW, MODERATE, or HIGH.

  PROBABILITY EVIDENCE TEST
  Probability requires either an adverse change already visible in comparable
  recurring operations or a measurable leading indicator with an established
  direction. Evidence describing only exposure, possible damage, or an external
  expectation does not establish probability. When probability is not
  established, use HYPOTHETICAL, NOT_ESTABLISHED, CONTINUATION_MORE_LIKELY, and
  LOW unless the cautious temporary-dependence floor applies. Forecasts may
  quantify material_effect but cannot establish probability.

  probability_indicator_type records the current observable basis for
  probability and must be one of NONE, GUIDANCE_REDUCTION, ORDER_CONTRACTION,
  UTILIZATION_DECLINE, PRICE_OR_MARGIN_COMPRESSION, CAPACITY_INCREASE,
  CONTRACT_EXPIRY, INVENTORY_CHANGE, REGULATORY_ACTION,
  FORWARD_MARKET_CHANGE, or OTHER_CURRENT_INDICATOR. Analyst forecasts and
  historical cyclicality are not indicator types. MODERATE/ELEVATED/SEVERE may
  not use NONE. OTHER_CURRENT_INDICATOR must name a specific current fact in
  probability_evidence.

  FORWARD_MARKET_CHANGE means observable operating-market data such as a
  contracted price, forward curve, order book, utilization outlook, announced
  supply, or documented demand change. An analyst forecast of company revenue,
  EPS, or stock performance is not a FORWARD_MARKET_CHANGE.

  probability_basis records the evidence category and must be one of:
  - COMPANY_REPORTED_CHANGE: comparable company-reported operations deteriorated
  - OBSERVABLE_MARKET_CHANGE: measurable operating-market data changed adversely
  - REGULATORY_OR_CONTRACT_ACTION: a current binding action changes operations
  - EXTERNAL_EXPECTATION_ONLY: evidence is limited to an outside expectation
  - NONE: no current probability evidence exists

  MODERATE or higher requires one of the first three probability_basis values.
  EXTERNAL_EXPECTATION_ONLY and NONE normally require LOW. The sole exception is
  the cautious temporary-dependence floor below. Classify the basis from the
  evidence itself, not the desired risk.

  CAUTIOUS TEMPORARY-DEPENDENCE FLOOR
  Use MODERATE even without a current normalization-probability indicator when
  all of the following are established:
  - a specific material temporary operating condition currently supports results
  - risk_basis is TEMPORARY_DRIVER_NORMALIZATION
  - catalyst_dependence is MODERATE or HIGH
  - losing the driver would materially weaken a normalized recurring metric
    within 0-12 months

  For this exposure-floor form of MODERATE, use HYPOTHETICAL,
  NOT_ESTABLISHED, CONTINUATION_MORE_LIKELY, probability_indicator_type NONE,
  and probability_basis NONE. current_fact and probability_evidence may be null,
  but material_effect and a 0-12 month risk_time_horizon are required. Ordinary
  cyclicality, volatility, or a difficult comparison does not qualify.

  RISK MAPPING
  Derive reversal_risk last from the completed fields:
  - MINIMAL: mechanism NONE, no material temporary dependence, and unusually
    strong continuation evidence
  - LOW: mechanism NONE or HYPOTHETICAL, or probability_indicator_type NONE,
    unless the cautious temporary-dependence floor applies
  - MODERATE: mechanism ACTIVE or UNUSUALLY_PROBABLE, a valid current probability
    indicator, qualifying probability_basis, material 0-12 month effect, and
    CONTINUATION_MORE_LIKELY; or the cautious temporary-dependence floor
  - ELEVATED: all MODERATE requirements plus AT_LEAST_AS_LIKELY and
    REVERSAL_AT_LEAST_AS_LIKELY
  - SEVERE: current recurring evidence shows the continuation thesis is broken

  Outside the cautious temporary-dependence floor, a higher potential loss
  cannot override missing probability. Never raise the classification to match
  an unsupported narrative; derive it from the evidence fields.

  EARNINGS COMPOSITION
  For companies whose earnings or book-value growth materially depends on
  financial, commodity, or digital-asset holdings, distinguish recurring customer
  operations from mark-to-market gains and asset appreciation. Do not describe
  asset appreciation or financing proceeds as durable operating drivers. Disclose
  asset-price and dilution dependence even when current reversal probability is
  not established.

  CRYPTO DEPENDENCE
  crypto_dependence records how much the business depends on cryptocurrency,
  digital tokens, blockchain-network economics, or crypto-related assets:
  - NONE: no meaningful crypto connection
  - INCIDENTAL: peripheral and immaterial to assets, revenue, or strategy
  - MATERIAL: materially affects assets, revenue, earnings, or strategy
  - PRIMARY: holding, staking, mining, trading, lending, or servicing crypto is
    the principal business model
  Base this field on the business and balance-sheet evidence, not current token
  direction or the desired portfolio outcome.

  TEMPORARY AND NONRECURRING ITEMS
  temporary_drivers contains only material temporary operating conditions that
  currently support normalized recurring results. If normalization_probability
  is NOT_APPLICABLE, temporary_drivers must be [].

  Nonrecurring refunds, gains, settlements, credits, recoveries, or asset sales
  are comparison adjustments, never temporary operating drivers. Remove them
  before evaluating recurring operations. Their disappearance cannot produce
  MODERATE or higher unless a separately sourced normalized recurring metric is
  already deteriorating; otherwise use NONRECURRING_COMPARISON_ONLY and LOW.

  risk_basis:
  - NONE
  - NORMALIZED_OPERATING_DETERIORATION
  - TEMPORARY_DRIVER_NORMALIZATION
  - NONRECURRING_COMPARISON_ONLY

  COMPLETE FIELD CONSISTENCY
  For every COMPLETE result:
  - risk_materiality is always LOW, MODERATE, or HIGH, never null
  - reversal_mechanism is a concise string; for no qualifying mechanism write
    "No qualifying current reversal mechanism established"
  - temporary_drivers is [] when no material temporary operating driver exists
  - LOW/MINIMAL normally use current_fact, probability_evidence,
    and material_effect as null unless needed to describe a hypothetical exposure
  - business_description is a factual 8-20 word plain-English description of
    the principal products, services, and operating market
  - industry_context is a current 12-25 word operating-industry condition, not
    broad stock-sector performance
  - explanation is a viewer-ready company-specific passage of 30-45 words
    covering current operating evidence, a durable driver, and the
    continuation/reversal balance; business_description separately supplies
    the introductory company overview
  - MODERATE/ELEVATED/SEVERE explanations explicitly state the current
    probability indicator, recurring metric affected, and 0-12 month link;
    "analysts forecast a decline" or "if conditions normalize" is insufficient

  SHARED EVENTS
  Use primary_risk_event_id only when current sources show the same documented
  event materially drives multiple candidates. Broad sector similarity is not
  enough. Different mechanism status or normalization probability within a real
  shared event requires a sourced company_difference involving contracts,
  geography, business mix, sensitivity, costs, or operating market.
  Shared-event consistency applies only to companies with comparable normalized
  risk_exposure_group values; an event alone does not make unlike business
  mechanisms comparable. Use a stable UPPER_SNAKE_CASE risk_exposure_group for
  the operating transmission mechanism, such as CRUDE_TANKER_SPOT_RATES or
  REFINING_CRACK_SPREADS, whenever primary_risk_event_id is non-null.

  COMPARABLE-COMPANY EVENT CONSISTENCY
  When comparable candidates operate through the same material market exposure,
  assess documented current shared events consistently. Use the same
  risk_exposure_group for the same operating transmission mechanism even when
  company exposure differs. If another comparable candidate is materially
  supported by a shared event, do not assign LOW while omitting that event unless
  current sources establish a company-specific difference such as contract
  coverage, geography, business mix, sensitivity, costs, or operating market.

  FIELD LIMITS
  - industry_group: concise UPPER_SNAKE_CASE label
  - business_description: 8-20 words
  - industry_context: 12-25 words
  - risk_exposure_group: concise UPPER_SNAKE_CASE label or null
  - crypto_dependence: NONE, INCIDENTAL, MATERIAL, or PRIMARY
  - research_incomplete_reason: at most 25 words or null
  - current_operating_evidence: at most 25 words
  - durable_drivers: 1-2 items, at most 18 words each
  - temporary_drivers: 0-2 items, at most 18 words each
  - reversal_mechanism: at most 25 words
  - current_fact: at most 20 words or null
  - probability_evidence: at most 25 words or null
  - material_effect: at most 25 words or null
  - company_difference: at most 25 words or null
  - explanation: 30-45 words or null only for INCOMPLETE
  - sources: 1-5 distinct materially used sources

  OUTPUT COVERAGE IS MANDATORY
  Emit one closed result block for every CANDIDATES entry. If evidence is
  insufficient, emit INCOMPLETE. Never omit a searched candidate. Shorten field
  values if needed to preserve complete coverage.
  After emitting END_STOCK_RESULT for a symbol, never emit that symbol again.
  Do not repeat, revise, or self-correct an earlier completed result block.

  OUTPUT FORMAT
  Return one independently parseable JSON object per candidate, in input order.
  Do not use an enclosing array/object, Markdown, commentary, commas, or list
  delimiters between blocks. Complete each block before starting the next:

  BEGIN_STOCK_RESULT
  {"one": "complete result object"}
  END_STOCK_RESULT

  Use exactly these keys:
  {
    "symbol": "SYMBOL",
    "research_status": "COMPLETE | INCOMPLETE",
    "research_incomplete_reason": null,
    "industry_group": "OPERATING_MARKET",
    "business_description": "Plain-English principal business description",
    "industry_context": "Current company-specific operating-industry condition",
    "crypto_dependence": "NONE | INCIDENTAL | MATERIAL | PRIMARY",
    "current_operating_evidence": "Concrete current operating fact",
    "reversal_risk": "MINIMAL | LOW | MODERATE | ELEVATED | SEVERE | null only when INCOMPLETE",
    "risk_basis": "NONE | NORMALIZED_OPERATING_DETERIORATION | TEMPORARY_DRIVER_NORMALIZATION | NONRECURRING_COMPARISON_ONLY | null only when INCOMPLETE",
    "catalyst_dependence": "LOW | MODERATE | HIGH | null only when INCOMPLETE",
    "mechanism_status": "NONE | HYPOTHETICAL | ACTIVE | UNUSUALLY_PROBABLE | null only when INCOMPLETE",
    "normalization_probability": "NOT_APPLICABLE | NOT_ESTABLISHED | REASONABLY_PROBABLE | AT_LEAST_AS_LIKELY | null only when INCOMPLETE",
    "continuation_outlook": "CONTINUATION_MORE_LIKELY | REVERSAL_AT_LEAST_AS_LIKELY | THESIS_BROKEN | null only when INCOMPLETE",
    "durable_drivers": ["..."],
    "temporary_drivers": [],
    "reversal_mechanism": "...",
    "current_fact": null,
    "probability_evidence": null,
    "probability_indicator_type": "NONE | GUIDANCE_REDUCTION | ORDER_CONTRACTION | UTILIZATION_DECLINE | PRICE_OR_MARGIN_COMPRESSION | CAPACITY_INCREASE | CONTRACT_EXPIRY | INVENTORY_CHANGE | REGULATORY_ACTION | FORWARD_MARKET_CHANGE | OTHER_CURRENT_INDICATOR",
    "probability_basis": "COMPANY_REPORTED_CHANGE | OBSERVABLE_MARKET_CHANGE | REGULATORY_OR_CONTRACT_ACTION | EXTERNAL_EXPECTATION_ONLY | NONE",
    "material_effect": null,
    "risk_time_horizon": "0_3_MONTHS | 3_6_MONTHS | 6_12_MONTHS | LONGER | null",
    "risk_materiality": "LOW | MODERATE | HIGH | null only when INCOMPLETE",
    "company_difference": null,
    "primary_risk_event_id": null,
    "risk_exposure_group": null,
    "explanation": "...",
    "sources": [
      {"title": "...", "date": "YYYY-MM-DD", "url": "https://..."}
    ]
  }

  Before responding, confirm every candidate has one closed block, every COMPLETE
  object obeys the cross-field rules, and no source list exceeds 5 entries.


prompt_html_summary: |
  You are a financial editor. Create polished viewer-facing HTML from a frozen,
  fully researched 10-stock portfolio.

  You will receive:
    1. MARKET_CONTEXT: validated current market research
    2. SELECTED_STOCKS: exactly 10 frozen selections containing exact Symbol,
       Name, Sector Group, Reversal Risk, Business Description, Industry
       Context, and validated research evidence

  This is an editorial formatting task only. Do not use Google Search. Do not
  add new facts, stocks, sectors, reversal-risk levels, or recommendations.
  Do not reclassify, replace, remove, reorder, or independently evaluate stocks.

  Return exactly one valid JSON object with no Markdown fence or extra text:
  {
    "summary_html": "<div class=\"summary\">...</div>"
  }

  SUMMARY HTML RULES
  Begin exactly with:
    <div class="summary">
    <h2>Market Chat:</h2>

  First write one <p> containing a polished 3-5 sentence market introduction
  based only on MARKET_CONTEXT. Cover current S&P 500 direction and a relevant
  percentage, whether conditions are STRONG, MIXED, or WEAK, investor mood, the
  largest 1-2 drivers, and the most important current concern.

  Then group only the 10 SELECTED_STOCKS by their exact supplied Sector Group.
  Provide exactly one <p> per represented Sector Group, in first-appearance
  order. Do not rename, merge, split, or reinterpret sectors.

  Begin each sector paragraph using exactly this structure:
    <p><strong>SECTOR GROUP</strong> (LINKED SYMBOLS): SECTOR CONTEXT. STOCK DISCUSSIONS.</p>

  Bold only the Sector Group itself, not the parentheses or colon. Put the linked
  symbols inside parentheses immediately after the Sector Group, separated by a
  comma and space. Use only this link format:
    <a href="https://finance.yahoo.com/quote/SYMBOL/" target="_blank"><strong>SYMBOL OR STOCK NAME</strong></a>

  Immediately after the colon, write one concise sentence describing the current
  context relevant to the selected companies using MARKET_CONTEXT and their
  supplied Industry Context fields. This sentence must come before all
  stock-specific discussions. Never use generic filler such as "most sectors are
  weak," "conditions are mixed," or "the sector remains relevant."

  For every selected stock:
    - mention its Symbol and Name, both bold and linked
    - briefly explain what it does using its supplied Business Description
    - explain why it is attractive now using only its supplied research fields
    - state its exact supplied Reversal Risk in bold, unlinked text
    - reflect its supplied continuation and reversal-risk balance
    - use approximately 45-70 words so an unfamiliar reader understands the
      business, current thesis, and principal risk

  Every selected symbol must appear under exactly its supplied Sector Group.
  Every selected stock must be discussed exactly once. No unselected symbol may
  appear. Only Symbols and Stock Names may be links. Do not include citations,
  sources, QVM scores or ranks, rejected stocks, internal variables, research
  process, portfolio-construction rules, or selection terminology.

  End exactly with:
    </div>
