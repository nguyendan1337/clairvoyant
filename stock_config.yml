  Do not:
    
    * create a paragraph for a Sector Group absent from the table
    * move a stock into a different Sector Group
    * regroup stocks by industry, products, business activity, commodity
    exposure, or editorial theme
    * add a researched, rejected, skipped, or previously considered stock that
    is absent from the table
    * include more than 2 stocks in any sector paragraph
  
  For a Sector Group containing ONE table stock, use this heading structure:
    
    <p>
    <strong>Sector Group Name (
  <a href="https://finance.yahoo.com/quote/SYMBOL/" target="_blank"><strong>SYMBOL</strong></a>):
    </strong>
  
  For a Sector Group containing TWO table stocks, use this heading structure:
    
    <p>
    <strong>Sector Group Name (
    <a href="https://finance.yahoo.com/quote/FIRST/" target="_blank"><strong>FIRST SYMBOL</strong></a>,
  <a href="https://finance.yahoo.com/quote/SECOND/" target="_blank"><strong>SECOND SYMBOL</strong></a>):
    </strong>
    
    Never add a second stock to a one-stock Sector Group.
  
  For each sector paragraph:
    
    * explain why the sector is currently attractive or relevant
    * explain the most important current industry driver
    * discuss every table stock belonging to that sector
    * for EACH stock, use one sentence to explain why that stock is attractive now, focusing on recent news and
